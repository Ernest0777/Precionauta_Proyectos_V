<!DOCTYPE html>
<html lang="es-MX">
<head>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("precionauta-admin:theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Panel · Precionauta</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="shared/tokens.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <!-- Acceso -->
  <section class="login" id="login" hidden>
    <form class="login__card" id="loginForm" novalidate>
      <span class="brand__mark" aria-hidden="true">P</span>
      <h1 class="login__title">Panel de Precionauta</h1>
      <p class="login__lead">Solo para el equipo. Entra con la contraseña del panel.</p>
      <label class="field">
        <span class="field__label">Contraseña</span>
        <input class="field__input" id="loginPassword" type="password" autocomplete="current-password" required />
      </label>
      <p class="login__error" id="loginError" role="alert" hidden></p>
      <button class="btn btn--primary btn--block" type="submit">Entrar</button>
    </form>
  </section>

  <!-- Panel -->
  <div class="app" id="app" hidden>
    <header class="topbar">
      <div class="topbar__inner">
        <a class="brand" href="#resumen" aria-label="Panel de Precionauta, ir al resumen">
          <span class="brand__mark" aria-hidden="true">P</span>
          <span class="brand__name">Precionauta <span class="brand__tag">Admin</span></span>
        </a>

        <nav class="tabs" aria-label="Secciones del panel">
          <a class="tab" href="#resumen" data-tab="resumen">
            <svg class="icon" viewBox="0 0 256 256" aria-hidden="true"><path d="M104,40H56A16,16,0,0,0,40,56v48a16,16,0,0,0,16,16h48a16,16,0,0,0,16-16V56A16,16,0,0,0,104,40Zm0,64H56V56h48Zm96-64H152a16,16,0,0,0-16,16v48a16,16,0,0,0,16,16h48a16,16,0,0,0,16-16V56A16,16,0,0,0,200,40Zm0,64H152V56h48Zm-96,32H56a16,16,0,0,0-16,16v48a16,16,0,0,0,16,16h48a16,16,0,0,0,16-16V152A16,16,0,0,0,104,136Zm0,64H56V152h48Zm96-64H152a16,16,0,0,0-16,16v48a16,16,0,0,0,16,16h48a16,16,0,0,0,16-16V152A16,16,0,0,0,200,136Zm0,64H152V152h48Z"/></svg>
            <span>Resumen</span>
          </a>
          <a class="tab" href="#moderacion" data-tab="moderacion">
            <svg class="icon" viewBox="0 0 256 256" aria-hidden="true"><path d="M208,32H48A16,16,0,0,0,32,48V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V48A16,16,0,0,0,208,32ZM48,48h48V208H48Zm64,0h32V160H112Zm96,160H160V48h48V208Z"/></svg>
            <span>Moderación</span>
            <span class="tab__count tabular" data-review-count hidden></span>
          </a>
          <a class="tab" href="#reportes" data-tab="reportes">
            <svg class="icon" viewBox="0 0 256 256" aria-hidden="true"><path d="M232,208a8,8,0,0,1-8,8H32a8,8,0,0,1-8-8V48a8,8,0,0,1,16,0v94.37L90.73,98a8,8,0,0,1,10.07-.38l58.81,44.11L218.73,90a8,8,0,1,1,10.54,12l-64,56a8,8,0,0,1-10.07.38L96.39,114.29,40,163.63V200H224A8,8,0,0,1,232,208Z"/></svg>
            <span>Reportes</span>
          </a>
        </nav>

        <div class="topbar__actions">
          <a class="icon-btn" href="http://localhost:4173" target="_blank" rel="noopener" title="Ver la tienda" aria-label="Ver la tienda en otra pestaña">
            <svg class="icon" viewBox="0 0 256 256" aria-hidden="true"><path d="M224,104a8,8,0,0,1-16,0V59.32l-66.33,66.34a8,8,0,0,1-11.32-11.32L196.68,48H152a8,8,0,0,1,0-16h64a8,8,0,0,1,8,8Zm-40,24a8,8,0,0,0-8,8v72H48V80h72a8,8,0,0,0,0-16H48A16,16,0,0,0,32,80V208a16,16,0,0,0,16,16H176a16,16,0,0,0,16-16V136A8,8,0,0,0,184,128Z"/></svg>
          </a>
          <button class="icon-btn" type="button" id="themeToggle" aria-label="Cambiar tema">
            <svg class="icon icon--sun" viewBox="0 0 256 256" aria-hidden="true"><path d="M120,40V16a8,8,0,0,1,16,0V40a8,8,0,0,1-16,0Zm72,88a64,64,0,1,1-64-64A64.07,64.07,0,0,1,192,128Zm-16,0a48,48,0,1,0-48,48A48.05,48.05,0,0,0,176,128ZM58.34,69.66A8,8,0,0,0,69.66,58.34l-16-16A8,8,0,0,0,42.34,53.66Zm0,116.68-16,16a8,8,0,0,0,11.32,11.32l16-16a8,8,0,0,0-11.32-11.32ZM192,72a8,8,0,0,0,5.66-2.34l16-16a8,8,0,0,0-11.32-11.32l-16,16A8,8,0,0,0,192,72Zm5.66,114.34a8,8,0,0,0-11.32,11.32l16,16a8,8,0,0,0,11.32-11.32ZM48,128a8,8,0,0,0-8-8H16a8,8,0,0,0,0,16H40A8,8,0,0,0,48,128Zm80,80a8,8,0,0,0-8,8v24a8,8,0,0,0,16,0V216A8,8,0,0,0,128,208Zm112-88H216a8,8,0,0,0,0,16h24a8,8,0,0,0,0-16Z"/></svg>
            <svg class="icon icon--moon" viewBox="0 0 256 256" aria-hidden="true"><path d="M233.54,142.23a8,8,0,0,0-8-2,88.08,88.08,0,0,1-109.8-109.8,8,8,0,0,0-10-10,104.84,104.84,0,0,0-52.91,37A104,104,0,0,0,136,224a103.09,103.09,0,0,0,62.52-20.88,104.84,104.84,0,0,0,37-52.91A8,8,0,0,0,233.54,142.23ZM188.9,190.34A88,88,0,0,1,65.66,67.11a89,89,0,0,1,31.4-26A106,106,0,0,0,96,56,104.11,104.11,0,0,0,200,160a106,106,0,0,0,14.92-1.06A89,89,0,0,1,188.9,190.34Z"/></svg>
          </button>
          <button class="btn btn--ghost btn--sm" type="button" id="logoutBtn">Salir</button>
        </div>
      </div>
    </header>

    <main class="main" id="main" tabindex="-1">
      <section class="page" id="page-resumen" data-page="resumen" hidden></section>
      <section class="page" id="page-moderacion" data-page="moderacion" hidden></section>
      <section class="page" id="page-reportes" data-page="reportes" hidden></section>
    </main>

    <!-- Panel lateral con el detalle de una oferta -->
    <div class="drawer" id="drawer" hidden>
      <div class="drawer__scrim" data-drawer-close></div>
      <aside class="drawer__panel" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" tabindex="-1">
        <button class="icon-btn drawer__close" type="button" data-drawer-close aria-label="Cerrar detalle">
          <svg class="icon" viewBox="0 0 256 256" aria-hidden="true"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/></svg>
        </button>
        <div class="drawer__body" id="drawerBody"></div>
      </aside>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div class="sr-only" id="announcer" aria-live="assertive"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
